name: VEXOR Cloud Server Runner

# =============================================================================
# services.json FORMAT (save to delta, gets restored every session)
# Windows: C:\Users\VEXOR\.config\vexor\services.json
# Linux:   /home/runner/.config/vexor/services.json
#
# [
#   {
#     "name": "my-telegram-bot",
#     "type": "telegram_bot",
#     "interpreter": "python3",
#     "path": "C:\\Users\\VEXOR\\bots\\bot.py",
#     "args": [],
#     "working_dir": "C:\\Users\\VEXOR\\bots",
#     "bot_token": "1234567890:ABCdef...",   <- webhook auto-update
#     "webhook_path": "/webhook"
#   },
#   {
#     "name": "node-api",
#     "type": "node",
#     "path": "C:\\Users\\VEXOR\\apps\\server.js",
#     "args": ["--port", "3000"],
#     "working_dir": "C:\\Users\\VEXOR\\apps"
#   }
# ]
#
# types: telegram_bot | telegram_bot_polling | python | node | process
# telegram_bot      -> starts + auto-sets webhook to ngrok URL
# telegram_bot_polling -> starts only (no webhook)
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Server OS (Windows or Linux Distros)'
        required: false
        default: 'windows-2022'
      ram_size:
        description: 'RAM Configuration'
        required: false
        default: '16GB'
      ngrok_token:
        description: 'Ngrok Auth Token'
        required: false
        default: ''
      ngrok_region:
        description: 'Ngrok Region'
        required: false
        default: 'eu'
      chain_id:
        description: 'Chain ID for Delta Backup (keeps state across sessions)'
        required: false
        default: ''
      auto_restart:
        description: 'Auto-restart new session when this one ends (infinite chain)'
        required: false
        default: 'true'

# ─── WINDOWS RDP JOB ─────────────────────────────────────────────────────────
jobs:
  rdp-setup:
    if: startsWith(github.event.inputs.windows_version, 'windows') || startsWith(github.event.inputs.windows_version, 'win') || github.event.inputs.windows_version == '' || github.event.inputs.windows_version == null
    runs-on: ${{ (github.event.inputs.windows_version == 'windows-2025' || github.event.inputs.windows_version == 'win2025-ai') && 'windows-2025' || 'windows-2022' }}
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read

    steps:
      # ── 1. Ngrok ─────────────────────────────────────────────────────────
      - name: Download and extract Ngrok v3
        shell: pwsh
        run: |
          Invoke-WebRequest "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath .
          Remove-Item ngrok.zip
          Copy-Item .\ngrok.exe C:\Windows\System32\ngrok.exe -Force

                # ── 2. RAM / Disk ────────────────────────────────────────────────────
      - name: Optimize Disk and Configure RAM
        shell: pwsh
        run: |
          $ramChoice = "${{ inputs.ram_size }}"
          if ($ramChoice -eq "32GB" -or $ramChoice -eq "64GB") {
            $pageMB = if ($ramChoice -eq "64GB") { 57344 } else { 24576 }
            try {
              Set-CimInstance -Query "Select * from Win32_ComputerSystem" -Property @{AutomaticManagedPagefile = $false} -ErrorAction SilentlyContinue
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' -Name 'PagingFiles' -Value @("C:\pagefile.sys $pageMB $pageMB") -ErrorAction SilentlyContinue
              Write-Output "[+] Pagefile set to $pageMB MB"
            } catch {}
          }
          Start-Job { Remove-Item -Recurse -Force "C:\hostedtoolcache" -ErrorAction SilentlyContinue } | Out-Null
          $freeGB = [Math]::Round((Get-PSDrive C).Free / 1GB, 1)
          Write-Output "[+] Free disk: $freeGB GB"

                # ── 3. RDP + Firewall ─────────────────────────────────────────────────
      - name: Enable RDP and Firewall
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 1 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "fPromptForPassword" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "PortNumber" -Value 3389 -Force
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "fDisableUDP" -Value 1 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa" -Name "LmCompatibilityLevel" -Value 2 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters" -Name "BlockNTLM" -Value 0 -Force -ErrorAction SilentlyContinue
          Set-Service -Name "TermService" -StartupType Automatic
          Restart-Service -Name "TermService" -Force
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False -ErrorAction SilentlyContinue
          netsh advfirewall firewall add rule name="Allow-RDP" dir=in action=allow protocol=TCP localport=3389
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP-3389" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -ErrorAction SilentlyContinue
          $ready = $false
          for ($i = 0; $i -lt 15; $i++) {
            if ((Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue).TcpTestSucceeded) {
              Write-Output "[+] RDP listening on :3389"
              $ready = $true; break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { Restart-Service -Name "TermService" -Force; Start-Sleep -Seconds 2 }

                # ── 4. Create VEXOR User ──────────────────────────────────────────────
      - name: Create VEXOR Admin User
        shell: pwsh
        run: |
          secedit /export /cfg C:\secpol.cfg
          (Get-Content C:\secpol.cfg).replace("PasswordComplexity = 1","PasswordComplexity = 0").replace("MinimumPasswordLength = 8","MinimumPasswordLength = 0") | Set-Content C:\secpol.cfg
          secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
          Remove-Item -Force C:\secpol.cfg -ErrorAction SilentlyContinue

          cmd.exe /c "net user VEXOR VEXOR@2026 /add /expires:never /active:yes"
          cmd.exe /c "net localgroup Administrators VEXOR /add"
          cmd.exe /c "net localgroup `"Remote Desktop Users`" VEXOR /add"
          cmd.exe /c "net user runneradmin VEXOR@2026 /active:yes"

          New-Item -ItemType Directory -Force -Path "C:\logs" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\Users\VEXOR\.config\vexor" | Out-Null
          Write-Output "[+] User VEXOR created with password VEXOR@2026"

                # ── 5. Ngrok Tunnel ───────────────────────────────────────────────────
      - name: Configure and Start Ngrok Tunnel
        id: ngrok-tunnel
        shell: pwsh
        env:
          DEFAULT_NGROK: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          $tok = "${{ inputs.ngrok_token }}"
          if (-not $tok) { $tok = $env:DEFAULT_NGROK }
          $reg = "${{ inputs.ngrok_region }}"
          if (-not $reg -or $reg -eq "gb") { $reg = "eu" }

          @(
            'version: "2"',
            "authtoken: $tok",
            "region: $reg",
            'tunnels:',
            '  rdp:',
            '    proto: tcp',
            '    addr: 127.0.0.1:3389'
          ) | Out-File -FilePath "C:\ngrok.yml" -Encoding ascii

          C:\Windows\System32\ngrok.exe service install --config="C:\ngrok.yml"
          C:\Windows\System32\ngrok.exe service start

          $tunnelUrl = $null
          $timeout = 30
          while ($timeout -gt 0 -and -not $tunnelUrl) {
            Start-Sleep -Seconds 2
            try {
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
              $tcp = $response.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1
              if ($tcp) { $tunnelUrl = $tcp.public_url -replace "^tcp://", "" }
            } catch {}
            $timeout--
          }

          if ($tunnelUrl) {
            Write-Output "[+] RDP Public: $tunnelUrl"
            echo "tunnel_url=$tunnelUrl" >> $env:GITHUB_OUTPUT
            echo "TUNNEL_HOST=$tunnelUrl" >> $env:GITHUB_ENV
          } else {
            Write-Output "[!] Failed to get tunnel URL"
            exit 1
          }

                # ── 6. Build .rdp Artifact (bug fixed — no duplicate $url) ───────────
      - name: Build and Upload .rdp Artifact
        shell: pwsh
        run: |
          @(
            "full address:s:${{ env.TUNNEL_HOST }}",
            "username:s:VEXOR",
            "prompt for credentials:i:1",
            "administrative session:i:1",
            "authentication level:i:0",
            "enablecredsspsupport:i:0",
            "autoreconnection enabled:i:1",
            "smart sizing:i:1",
            "screen mode id:i:2",
            "desktopwidth:i:1920",
            "desktopheight:i:1080",
            "redirectclipboard:i:1"
          ) | Out-File -FilePath rdp-connection.rdp -Encoding ascii
          Write-Output "[+] .rdp file ready: ${{ env.TUNNEL_HOST }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdp-connection
          path: rdp-connection.rdp
          retention-days: 1

      # ── 7. OpenCode AI + REA ──────────────────────────────────────────────
      - name: Install OpenCode AI and REA Tools
        continue-on-error: true
        shell: pwsh
        run: |
          try { npm install -g opencode-ai @opencode/cli rea-agents --force } catch { Write-Output "[!] npm: $_" }
          try {
            $npmPrefix = (npm config get prefix).Trim()
            $curPath = [Environment]::GetEnvironmentVariable("Path","Machine")
            if ($curPath -notlike "*$npmPrefix*") {
              [Environment]::SetEnvironmentVariable("Path","$curPath;$npmPrefix","Machine")
            }
          } catch {}

          reg add "HKCU\Console" /v CodePage /t REG_DWORD /d 65001 /f | Out-Null
          reg add "HKCU\Console" /v VirtualTerminalLevel /t REG_DWORD /d 1 /f | Out-Null

          $regPreload = "HKCU:\Keyboard Layout\Preload"
          if (-not (Test-Path $regPreload)) { New-Item -Path $regPreload -Force | Out-Null }
          Set-ItemProperty -Path $regPreload -Name "1" -Value "00000409" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $regPreload -Name "2" -Value "00000401" -ErrorAction SilentlyContinue

          $arabicRules = @(
            '# Arabic Language Rules',
            '- Always write in proper connected Arabic.',
            '- Never add spaces between letters of the same word.',
            '- Keep English/code identifiers as-is, explain in Arabic.'
          ) -join "`r`n"

          $cfg = @{
            "`$schema" = "https://opencode.ai/config.json"
            instructions = @("C:\Users\Public\.config\opencode\arabic_rules.md")
            mcp = @{ rea = @{ type = "local"; command = @("npx","-y","rea-agents","mcp"); enabled = $true } }
          } | ConvertTo-Json -Depth 5

          $dirs = @(
            "C:\Users\Public\.config\opencode",
            "C:\Users\VEXOR\.config\opencode",
            "C:\Users\VEXOR\AppData\Roaming\opencode",
            "C:\Users\VEXOR",
            "C:\Users\runneradmin\.config\opencode",
            "C:\Users\runneradmin\AppData\Roaming\opencode",
            "C:\Users\Default\.config\opencode"
          )
          foreach ($d in $dirs) {
            if (-not (Test-Path $d)) { New-Item -ItemType Directory -Path $d -Force | Out-Null }
            Set-Content "$d\opencode.json" -Value $cfg -Encoding UTF8
            Set-Content "$d\arabic_rules.md" -Value $arabicRules -Encoding UTF8
            Set-Content "$d\AGENTS.md"       -Value $arabicRules -Encoding UTF8
          }
          Write-Output "[+] OpenCode AI + REA configured"

                # ── 8. Delta Restore + Baseline ───────────────────────────────────────
      - name: Baseline Snapshot and Delta Restore
        continue-on-error: true
        shell: pwsh
        run: |
          $chainId = "${{ inputs.chain_id }}".Trim()
          $vpsUrl  = "http://191.215.42.79:8765/backup/$chainId?secret=gitube_delta_2026"

          function Get-DirNames($path) {
            if (Test-Path $path) { return @(Get-ChildItem -Path $path -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) }
            return @()
          }

          $baseline = @{
            ProgramFiles     = Get-DirNames "C:\Program Files"
            ProgramFilesX86  = Get-DirNames "C:\Program Files (x86)"
            AppDataLocalProg = Get-DirNames "C:\Users\VEXOR\AppData\Local\Programs"
            AppDataRoaming   = Get-DirNames "C:\Users\VEXOR\AppData\Roaming"
            VEXORDesktop     = Get-DirNames "C:\Users\VEXOR\Desktop"
            PublicDesktop    = Get-DirNames "C:\Users\Public\Desktop"
            VEXORDownloads   = Get-DirNames "C:\Users\VEXOR\Downloads"
            VEXORDocuments   = Get-DirNames "C:\Users\VEXOR\Documents"
          }
          $baseline | ConvertTo-Json -Depth 4 | Set-Content "C:\rdp_baseline.json" -Encoding UTF8
          Write-Output "[+] Baseline recorded."

          if ($chainId -ne "") {
            Write-Output "[*] Chain ($chainId) active — checking VPS for delta backup..."
            $zipFile    = "C:\delta_restore.zip"
            $extractDir = "C:\delta_restore_stage"
            try {
              Invoke-WebRequest -Uri $vpsUrl -Method Get -OutFile $zipFile -TimeoutSec 120 -ErrorAction Stop
              if ((Test-Path $zipFile) -and (Get-Item $zipFile).Length -gt 100) {
                Write-Output "[+] Delta found ($((Get-Item $zipFile).Length) bytes) — restoring..."
                Expand-Archive -Path $zipFile -DestinationPath $extractDir -Force
                $map = @{
                  "ProgramFiles"     = "C:\Program Files"
                  "ProgramFilesX86"  = "C:\Program Files (x86)"
                  "AppDataLocalProg" = "C:\Users\VEXOR\AppData\Local\Programs"
                  "AppDataRoaming"   = "C:\Users\VEXOR\AppData\Roaming"
                  "VEXORDesktop"     = "C:\Users\VEXOR\Desktop"
                  "PublicDesktop"    = "C:\Users\Public\Desktop"
                  "VEXORDownloads"   = "C:\Users\VEXOR\Downloads"
                  "VEXORDocuments"   = "C:\Users\VEXOR\Documents"
                  "OpenCodeConfig"   = "C:\Users\VEXOR\.config\opencode"
                  "VEXORConfig"      = "C:\Users\VEXOR\.config\vexor"
                }
                foreach ($k in $map.Keys) {
                  $src = Join-Path $extractDir $k
                  $dst = $map[$k]
                  if (Test-Path $src) {
                    if (-not (Test-Path $dst)) { New-Item -ItemType Directory -Path $dst -Force | Out-Null }
                    Copy-Item -Path "$src\*" -Destination $dst -Recurse -Force -ErrorAction SilentlyContinue
                  }
                }
                if (Test-Path "$extractDir\user_apps.reg") {
                  reg import "$extractDir\user_apps.reg" 2>$null
                }
                Remove-Item -Path $zipFile    -Force -ErrorAction SilentlyContinue
                Remove-Item -Path $extractDir -Recurse -Force -ErrorAction SilentlyContinue
                Write-Output "[+] Delta restored. Deleting from VPS..."
                try { Invoke-RestMethod -Uri $vpsUrl -Method Delete -TimeoutSec 30 -ErrorAction SilentlyContinue | Out-Null } catch {}
              }
            } catch {
              Write-Output "[*] No previous delta or already cleaned."
            }
          }

          # Create delta exporter script
          $deltaScript = @'
          param([string]$ChainId)
          if (-not $ChainId) { exit 0 }
          $vpsUrl = "http://191.215.42.79:8765/backup/$ChainId?secret=gitube_delta_2026"
          if (-not (Test-Path "C:\rdp_baseline.json")) { exit 0 }
          $base  = Get-Content "C:\rdp_baseline.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          $stage = "C:\delta_export_stage"
          $zipOut = "C:\delta_backup.zip"
          Remove-Item -Path $stage  -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path $zipOut -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          $vpsPrefsUrl = "http://191.215.42.79:8765/sync-prefs/$ChainId?secret=gitube_delta_2026"
          $syncPrefs = $null
          try { $syncPrefs = Invoke-RestMethod -Uri $vpsPrefsUrl -Method Get -TimeoutSec 10 -ErrorAction SilentlyContinue } catch {}
          if (-not $syncPrefs) {
            $syncPrefs = @{ desktop=$true; downloads=$true; documents=$true; installed_apps=$true; appdata=$true; ai_projects=$true; vexor_config=$true }
          }

          $targets = @()
          if ($syncPrefs.installed_apps) {
            $targets += @{ Key="ProgramFiles";     Path="C:\Program Files" }
            $targets += @{ Key="ProgramFilesX86";  Path="C:\Program Files (x86)" }
            $targets += @{ Key="AppDataLocalProg"; Path="C:\Users\VEXOR\AppData\Local\Programs" }
          }
          if ($syncPrefs.appdata)      { $targets += @{ Key="AppDataRoaming"; Path="C:\Users\VEXOR\AppData\Roaming" } }
          if ($syncPrefs.desktop)      {
            $targets += @{ Key="VEXORDesktop";  Path="C:\Users\VEXOR\Desktop" }
            $targets += @{ Key="PublicDesktop"; Path="C:\Users\Public\Desktop" }
          }
          if ($syncPrefs.downloads)    { $targets += @{ Key="VEXORDownloads";  Path="C:\Users\VEXOR\Downloads" } }
          if ($syncPrefs.documents)    { $targets += @{ Key="VEXORDocuments";  Path="C:\Users\VEXOR\Documents" } }
          if ($syncPrefs.ai_projects)  { $targets += @{ Key="OpenCodeConfig";  Path="C:\Users\VEXOR\.config\opencode" } }
          # Always sync VEXOR config (services.json lives here)
          $targets += @{ Key="VEXORConfig"; Path="C:\Users\VEXOR\.config\vexor" }

          $foundCount = 0
          foreach ($t in $targets) {
            $p = $t.Path
            if (-not (Test-Path $p)) { continue }
            $origList = @($base.($t.Key))
            $items = Get-ChildItem -Path $p -Force -ErrorAction SilentlyContinue
            foreach ($item in $items) {
              if ($origList -notcontains $item.Name -or $t.Key -eq "VEXORConfig") {
                $destSub = Join-Path $stage $t.Key
                if (-not (Test-Path $destSub)) { New-Item -ItemType Directory -Path $destSub -Force | Out-Null }
                Copy-Item -Path $item.FullName -Destination (Join-Path $destSub $item.Name) -Recurse -Force -ErrorAction SilentlyContinue
                $foundCount++
              }
            }
          }

          if ($foundCount -gt 0) {
            Compress-Archive -Path "$stage\*" -DestinationPath $zipOut -CompressionLevel Fastest -Force
            if (Test-Path $zipOut) {
              try {
                Invoke-RestMethod -Uri $vpsUrl -Method Post -InFile $zipOut -ContentType "application/octet-stream" -TimeoutSec 180 | Out-Null
                Write-Output "[+] Delta synced ($foundCount items)"
              } catch { Write-Output "[!] Delta sync failed: $_" }
            }
          }
          Remove-Item -Path $stage  -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path $zipOut -Force -ErrorAction SilentlyContinue
          '@
          Set-Content -Path "C:\sync_delta_apps.ps1" -Value $deltaScript -Encoding UTF8

                # ── 9. Start VEXOR Services (Bots + Services from services.json) ──────
      - name: Start VEXOR Services
        continue-on-error: true
        shell: pwsh
        env:
          TUNNEL_HOST: ${{ steps.ngrok-tunnel.outputs.tunnel_url }}
        run: |
          $svcsFile = "C:\Users\VEXOR\.config\vexor\services.json"
          $pidsFile = "C:\Users\VEXOR\.config\vexor\pids.json"

          if (-not (Test-Path $svcsFile)) {
            Write-Output "[*] No services.json — skipping service startup."
            Write-Output "[*] Create C:\Users\VEXOR\.config\vexor\services.json to auto-start bots."
            exit 0
          }

          $services = Get-Content $svcsFile -Raw | ConvertFrom-Json
          $pids     = @{}
          $tunnel   = $env:TUNNEL_HOST

          foreach ($svc in $services) {
            $interp = if ($svc.interpreter) { $svc.interpreter } else { "python3" }
            $wdir   = if ($svc.working_dir) { $svc.working_dir } else { "C:\Users\VEXOR" }
            $argStr = if ($svc.args)        { $svc.args -join ' ' } else { "" }
            $logOut = "C:\logs\$($svc.name).log"
            $logErr = "C:\logs\$($svc.name)_err.log"
            $proc   = $null

            try {
              switch ($svc.type) {
                "telegram_bot"         { $proc = Start-Process $interp     -ArgumentList "$($svc.path) $argStr" -WorkingDirectory $wdir -WindowStyle Hidden -PassThru -RedirectStandardOutput $logOut -RedirectStandardError $logErr }
                "telegram_bot_polling" { $proc = Start-Process $interp     -ArgumentList "$($svc.path) $argStr" -WorkingDirectory $wdir -WindowStyle Hidden -PassThru -RedirectStandardOutput $logOut -RedirectStandardError $logErr }
                "python"               { $proc = Start-Process "python3"   -ArgumentList "$($svc.path) $argStr" -WorkingDirectory $wdir -WindowStyle Hidden -PassThru -RedirectStandardOutput $logOut -RedirectStandardError $logErr }
                "node"                 { $proc = Start-Process "node"      -ArgumentList "$($svc.path) $argStr" -WorkingDirectory $wdir -WindowStyle Hidden -PassThru -RedirectStandardOutput $logOut -RedirectStandardError $logErr }
                default                { $proc = Start-Process $svc.path   -ArgumentList $argStr                -WorkingDirectory $wdir -WindowStyle Hidden -PassThru -RedirectStandardOutput $logOut -RedirectStandardError $logErr }
              }

              if ($proc) {
                $pids[$svc.name] = $proc.Id
                Write-Output "[+] Started: $($svc.name) | PID: $($proc.Id) | Type: $($svc.type)"

                # Auto-set Telegram webhook to current ngrok URL
                if ($svc.type -eq "telegram_bot" -and $svc.bot_token -and $tunnel) {
                  Start-Sleep -Seconds 2
                  $wpath = if ($svc.webhook_path) { $svc.webhook_path } else { "/webhook" }
                  try {
                    $body = @{ url = "https://$tunnel$wpath" } | ConvertTo-Json
                    $resp = Invoke-RestMethod "https://api.telegram.org/bot$($svc.bot_token)/setWebhook" -Method Post -Body $body -ContentType "application/json"
                    Write-Output "[+] Webhook -> https://$tunnel$wpath : $($resp.description)"
                  } catch { Write-Output "[!] Webhook failed for $($svc.name): $_" }
                }
              }
            } catch {
              Write-Output "[!] Failed to start $($svc.name): $_"
            }
          }

          $pids | ConvertTo-Json | Set-Content $pidsFile
          Write-Output "[+] Service PIDs saved."

                # ── 10. Keep Alive (watchdog + auto-restart at 350min) ───────────────
      - name: Keep Alive Session
        shell: pwsh
        env:
          TUNNEL_HOST:  ${{ steps.ngrok-tunnel.outputs.tunnel_url }}
          CHAIN_ID:     ${{ inputs.chain_id }}
          AUTO_RESTART: ${{ inputs.auto_restart }}
          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:      ${{ github.repository }}
          GH_REF:       ${{ github.ref_name }}
          WIN_VERSION:  ${{ inputs.windows_version }}
          RAM_SIZE:     ${{ inputs.ram_size }}
          NGROK_TOKEN:  ${{ inputs.ngrok_token }}
          NGROK_REGION: ${{ inputs.ngrok_region }}
        run: |
          Write-Output "[+] VEXOR RDP Live: $env:TUNNEL_HOST"
          $start          = Get-Date
          $loops          = 0
          $autoTriggered  = $false

          while ($true) {
            $elapsed = ((Get-Date) - $start).TotalMinutes
            $loops++

            # ── Ngrok service watchdog ──────────────────────────────────────
            $svc = Get-Service -Name "ngrok" -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne "Running") {
              Write-Output "[!] Ngrok down at $([Math]::Round($elapsed,1))m — restarting..."
              Start-Service -Name "ngrok" -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 5

              # Get new URL and re-update webhooks
              $newUrl = $null
              for ($i = 0; $i -lt 15; $i++) {
                try {
                  $r = Invoke-RestMethod "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
                  $t = $r.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1
                  if ($t) { $newUrl = $t.public_url -replace "^tcp://",""; break }
                } catch {}
                Start-Sleep -Seconds 2
              }
              if ($newUrl) {
                $env:TUNNEL_HOST = $newUrl
                Write-Output "[+] New tunnel: $newUrl"
                $svcsFile = "C:\Users\VEXOR\.config\vexor\services.json"
                if (Test-Path $svcsFile) {
                  (Get-Content $svcsFile | ConvertFrom-Json) | Where-Object { $_.type -eq "telegram_bot" -and $_.bot_token } | ForEach-Object {
                    $wpath = if ($_.webhook_path) { $_.webhook_path } else { "/webhook" }
                    try {
                      Invoke-RestMethod "https://api.telegram.org/bot$($_.bot_token)/setWebhook" `
                        -Method Post -Body (@{url="https://$newUrl$wpath"} | ConvertTo-Json) `
                        -ContentType "application/json" | Out-Null
                      Write-Output "[+] Webhook re-updated for $($_.name)"
                    } catch {}
                  }
                }
              }
            }

            # ── Services watchdog (every 5 loops = ~10 min) ────────────────
            if ($loops % 5 -eq 0) {
              $pidsFile = "C:\Users\VEXOR\.config\vexor\pids.json"
              $svcsFile = "C:\Users\VEXOR\.config\vexor\services.json"
              if ((Test-Path $pidsFile) -and (Test-Path $svcsFile)) {
                $pidObj  = Get-Content $pidsFile | ConvertFrom-Json
                $svcs    = Get-Content $svcsFile | ConvertFrom-Json
                $pidMap  = @{}
                foreach ($prop in $pidObj.PSObject.Properties) { $pidMap[$prop.Name] = $prop.Value }
                $changed = $false

                foreach ($svc2 in $svcs) {
                  $pid = $pidMap[$svc2.name]
                  if ($pid -and -not (Get-Process -Id $pid -ErrorAction SilentlyContinue)) {
                    Write-Output "[!] $($svc2.name) (PID $pid) died — restarting..."
                    $interp = if ($svc2.interpreter) { $svc2.interpreter } else { "python3" }
                    $wdir   = if ($svc2.working_dir) { $svc2.working_dir } else { "C:\Users\VEXOR" }
                    $argStr = if ($svc2.args)         { $svc2.args -join ' ' } else { "" }
                    $lout   = "C:\logs\$($svc2.name).log"
                    $lerr   = "C:\logs\$($svc2.name)_err.log"
                    $newP   = $null
                    switch ($svc2.type) {
                      "telegram_bot"         { $newP = Start-Process $interp   -ArgumentList "$($svc2.path) $argStr" -WorkingDirectory $wdir -WindowStyle Hidden -PassThru -RedirectStandardOutput $lout -RedirectStandardError $lerr }
                      "telegram_bot_polling" { $newP = Start-Process $interp   -ArgumentList "$($svc2.path) $argStr" -WorkingDirectory $wdir -WindowStyle Hidden -PassThru -RedirectStandardOutput $lout -RedirectStandardError $lerr }
                      "python"               { $newP = Start-Process "python3" -ArgumentList "$($svc2.path) $argStr" -WorkingDirectory $wdir -WindowStyle Hidden -PassThru -RedirectStandardOutput $lout -RedirectStandardError $lerr }
                      "node"                 { $newP = Start-Process "node"    -ArgumentList "$($svc2.path) $argStr" -WorkingDirectory $wdir -WindowStyle Hidden -PassThru -RedirectStandardOutput $lout -RedirectStandardError $lerr }
                      default                { $newP = Start-Process $svc2.path -ArgumentList $argStr -WorkingDirectory $wdir -WindowStyle Hidden -PassThru -RedirectStandardOutput $lout -RedirectStandardError $lerr }
                    }
                    if ($newP) { $pidMap[$svc2.name] = $newP.Id; $changed = $true; Write-Output "[+] Restarted $($svc2.name) PID: $($newP.Id)" }
                  }
                }
                if ($changed) { $pidMap | ConvertTo-Json | Set-Content $pidsFile }
              }
            }

            # ── Delta sync (every 5 loops) ─────────────────────────────────
            if ($env:CHAIN_ID -and ($loops % 5 -eq 0)) {
              try { powershell -NoProfile -ExecutionPolicy Bypass -File "C:\sync_delta_apps.ps1" -ChainId $env:CHAIN_ID } catch {}
            }

            # ── Auto-restart at 350 min (10 min before GitHub kills us) ────
            if ($elapsed -ge 350 -and -not $autoTriggered -and $env:AUTO_RESTART -eq "true") {
              Write-Output "[*] 350 min elapsed — saving delta + triggering next session..."

              if ($env:CHAIN_ID) {
                try { powershell -NoProfile -ExecutionPolicy Bypass -File "C:\sync_delta_apps.ps1" -ChainId $env:CHAIN_ID } catch {}
              }

              $body = @{
                ref    = $env:GH_REF
                inputs = @{
                  windows_version = $env:WIN_VERSION
                  ram_size        = $env:RAM_SIZE
                  ngrok_token     = $env:NGROK_TOKEN
                  ngrok_region    = $env:NGROK_REGION
                  chain_id        = $env:CHAIN_ID
                  auto_restart    = "true"
                }
              } | ConvertTo-Json -Depth 3

              $headers = @{
                "Authorization" = "token $env:GH_TOKEN"
                "Accept"        = "application/vnd.github.v3+json"
                "Content-Type"  = "application/json"
              }
              try {
                Invoke-RestMethod "https://api.github.com/repos/$env:GH_REPO/actions/workflows/main.yml/dispatches" `
                  -Method Post -Headers $headers -Body $body -ErrorAction Stop
                Write-Output "[+] Next session triggered! Exiting keep-alive."
                $autoTriggered = $true
              } catch {
                Write-Output "[!] Auto-restart failed: $_ — will retry next loop"
              }
              if ($autoTriggered) { break }
            }

            Write-Output "[~] $([Math]::Round($elapsed,1))m | Loop $loops | $env:TUNNEL_HOST"
            Start-Sleep -Seconds 120
          }

                # ── 11. Cleanup ───────────────────────────────────────────────────────
      - name: Cleanup and Final Sync
        if: always()
        shell: pwsh
        env:
          CHAIN_ID:     ${{ inputs.chain_id }}
          AUTO_RESTART: ${{ inputs.auto_restart }}
          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:      ${{ github.repository }}
          GH_REF:       ${{ github.ref_name }}
          WIN_VERSION:  ${{ inputs.windows_version }}
          RAM_SIZE:     ${{ inputs.ram_size }}
          NGROK_TOKEN:  ${{ inputs.ngrok_token }}
          NGROK_REGION: ${{ inputs.ngrok_region }}
        run: |
          # Final delta save
          if ($env:CHAIN_ID) {
            try { powershell -NoProfile -ExecutionPolicy Bypass -File "C:\sync_delta_apps.ps1" -ChainId $env:CHAIN_ID } catch {}
          }
          # Fallback trigger if keep-alive exited abnormally without auto-triggering
          if ($env:AUTO_RESTART -eq "true") {
            $body = @{
              ref    = $env:GH_REF
              inputs = @{
                windows_version = $env:WIN_VERSION
                ram_size        = $env:RAM_SIZE
                ngrok_token     = $env:NGROK_TOKEN
                ngrok_region    = $env:NGROK_REGION
                chain_id        = $env:CHAIN_ID
                auto_restart    = "true"
              }
            } | ConvertTo-Json -Depth 3
            $headers = @{
              "Authorization" = "token $env:GH_TOKEN"
              "Accept"        = "application/vnd.github.v3+json"
              "Content-Type"  = "application/json"
            }
            try {
              Invoke-RestMethod "https://api.github.com/repos/$env:GH_REPO/actions/workflows/main.yml/dispatches" `
                -Method Post -Headers $headers -Body $body -ErrorAction SilentlyContinue | Out-Null
              Write-Output "[+] Fallback: next session triggered from cleanup."
            } catch {}
          }
          try { C:\Windows\System32\ngrok.exe service stop } catch {}
          try { C:\Windows\System32\ngrok.exe service uninstall } catch {}


# ─── LINUX VPS JOB ───────────────────────────────────────────────────────────
  vps-setup:
    if: github.event.inputs.windows_version != '' && github.event.inputs.windows_version != null && !startsWith(github.event.inputs.windows_version, 'windows') && !startsWith(github.event.inputs.windows_version, 'win') && !startsWith(github.event.inputs.windows_version, 'mac')
    runs-on: ${{ (github.event.inputs.windows_version == 'ubuntu-24.04' || github.event.inputs.windows_version == 'ubuntu24-ai' || github.event.inputs.windows_version == 'ubuntu24-gui-ai') && 'ubuntu-24.04' || ((github.event.inputs.windows_version == 'ubuntu-22.04' || github.event.inputs.windows_version == 'ubuntu22-ai' || github.event.inputs.windows_version == 'ubuntu22-gui-ai') && 'ubuntu-22.04' || 'ubuntu-latest') }}
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read

    steps:
      # ── 1. GUI Setup (XFCE + XRDP) ───────────────────────────────────────
      - name: Setup GUI Desktop (XFCE + XRDP)
        if: "endsWith(inputs.windows_version, '-gui') || endsWith(inputs.windows_version, '-gui-ai')"
        run: |
          TARGET_OS="${{ inputs.windows_version }}"
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xfce4 xfce4-terminal xrdp xorgxrdp dbus-x11 x11-xserver-utils python3-tk curl wget nano python3-pip

          echo "runner:VEXOR@2026" | sudo chpasswd
          echo "root:VEXOR@2026"   | sudo chpasswd
          sudo adduser xrdp ssl-cert
          sudo adduser runner ssl-cert

          sudo mkdir -p /etc/polkit-1/localauthority/50-local.d
          cat << 'EOF' | sudo tee /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla > /dev/null
          [Allow Colord all Users]
          Identity=unix-user:*
          Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile
          ResultAny=no
