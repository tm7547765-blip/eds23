            sudo chown -R runner:runner "$p/.config" 2>/dev/null || true
          done
          echo "[+] OpenCode AI + REA ready on Linux"

                # ── 7. Ngrok Tunnel (Linux) ───────────────────────────────────────────
      - name: Configure and Start Ngrok Tunnel
        id: ngrok-tunnel
        run: |
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar xz
          sudo mv ngrok /usr/local/bin/ngrok

          tok="${{ inputs.ngrok_token }}"
          if [ -z "$tok" ]; then tok="${{ secrets.NGROK_AUTH_TOKEN }}"; fi
          reg="${{ inputs.ngrok_region }}"
          if [ -z "$reg" ] || [ "$reg" = "gb" ]; then reg="eu"; fi
          port="${{ env.TARGET_PORT }}"
          if [ -z "$port" ]; then port=22; fi

          nohup ngrok tcp "$port" --authtoken "$tok" --region "$reg" --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 3
          tunnel_url=""
          for i in $(seq 1 25); do
            tunnel_url=$(curl -s http://127.0.0.1:4040/api/tunnels | grep -o 'tcp://[^"]*' | head -n1 | sed 's|tcp://||')
            if [ -n "$tunnel_url" ]; then break; fi
            sleep 2
          done
          if [ -n "$tunnel_url" ]; then
            echo "tunnel_url=$tunnel_url" >> $GITHUB_OUTPUT
            echo "TUNNEL_HOST=$tunnel_url" >> $GITHUB_ENV
            echo "[+] Tunnel: $tunnel_url"
          else
            cat /tmp/ngrok.log
            exit 1
          fi

                # ── 8. Build SSH connection info ──────────────────────────────────────
      - name: Build Connection Artifact
        run: |
          url="${{ steps.ngrok-tunnel.outputs.tunnel_url }}"
          host=$(echo $url | cut -d: -f1)
          sshport=$(echo $url | cut -d: -f2)

          cat > connection-info.txt << EOF
          ============================================
           VEXOR Linux VPS — Connection Info
          ============================================
           SSH Host : $host
           SSH Port : $sshport
           User     : runner
           Password : VEXOR@2026
          
           Command  : ssh runner@$host -p $sshport
          ============================================
          EOF

          cat > rdp-connection.rdp << EOF
          full address:s:$url
          username:s:runner
          prompt for credentials:i:1
          administrative session:i:1
          authentication level:i:0
          enablecredsspsupport:i:0
          autoreconnection enabled:i:1
          smart sizing:i:1
          screen mode id:i:2
          desktopwidth:i:1920
          desktopheight:i:1080
          redirectclipboard:i:1
          EOF
          cat connection-info.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vps-connection
          path: |
            rdp-connection.rdp
            connection-info.txt
          retention-days: 1

      # ── 9. Linux Delta Restore ────────────────────────────────────────────
      - name: Delta Restore (Linux)
        continue-on-error: true
        run: |
          CHAIN_ID="${{ inputs.chain_id }}"
          VPS_URL="http://191.215.42.79:8765/backup/$CHAIN_ID?secret=gitube_delta_2026"

          if [ -z "$CHAIN_ID" ]; then
            echo "[*] No chain_id — skipping delta restore."
            exit 0
          fi

          echo "[*] Checking VPS for delta backup (chain: $CHAIN_ID)..."
          curl -s -o /tmp/delta_restore.zip "$VPS_URL" --max-time 120 || true

          if [ -f /tmp/delta_restore.zip ] && [ "$(wc -c < /tmp/delta_restore.zip)" -gt 100 ]; then
            echo "[+] Delta found — restoring..."
            mkdir -p /tmp/delta_stage
            unzip -o /tmp/delta_restore.zip -d /tmp/delta_stage || true
            rsync -a /tmp/delta_stage/home_runner/ /home/runner/ 2>/dev/null || true
            rm -rf /tmp/delta_restore.zip /tmp/delta_stage

            echo "[+] Delta restored. Deleting from VPS..."
            curl -s -X DELETE "$VPS_URL" --max-time 30 || true
          else
            echo "[*] No delta backup found — fresh start."
            rm -f /tmp/delta_restore.zip
          fi

                # ── 10. Start VEXOR Services (Linux) ─────────────────────────────────
      - name: Start VEXOR Services (Linux)
        continue-on-error: true
        env:
          TUNNEL_HOST: ${{ steps.ngrok-tunnel.outputs.tunnel_url }}
        run: |
          SVCS_FILE="/home/runner/.config/vexor/services.json"
          PIDS_FILE="/home/runner/.config/vexor/pids.json"

          if [ ! -f "$SVCS_FILE" ]; then
            echo "[*] No services.json — skipping."
            echo "[*] Create $SVCS_FILE to auto-start bots and services."
            exit 0
          fi

          TUNNEL="$TUNNEL_HOST"

          python3 << PYEOF
          import json, subprocess, os, sys, time

          SVCS_FILE = "/home/runner/.config/vexor/services.json"
          PIDS_FILE = "/home/runner/.config/vexor/pids.json"
          TUNNEL    = os.environ.get("TUNNEL_HOST", "")

          with open(SVCS_FILE) as f:
              services = json.load(f)

          pids = {}
          os.makedirs("/home/runner/logs", exist_ok=True)

          for svc in services:
              name     = svc.get("name", "unknown")
              svc_type = svc.get("type", "process")
              wdir     = svc.get("working_dir", "/home/runner")
              args     = svc.get("args", [])
              interp   = svc.get("interpreter", "python3")
              log_out  = open(f"/home/runner/logs/{name}.log", "a")
              log_err  = open(f"/home/runner/logs/{name}_err.log", "a")

              try:
                  if svc_type in ("telegram_bot", "telegram_bot_polling"):
                      cmd = [interp, svc["path"]] + args
                  elif svc_type == "python":
                      cmd = ["python3", svc["path"]] + args
                  elif svc_type == "node":
                      cmd = ["node", svc["path"]] + args
                  else:
                      cmd = [svc["path"]] + args

                  proc = subprocess.Popen(cmd, cwd=wdir, stdout=log_out, stderr=log_err)
                  pids[name] = proc.pid
                  print(f"[+] Started: {name} | PID: {proc.pid} | Type: {svc_type}")

                  # Telegram webhook auto-update
                  if svc_type == "telegram_bot" and svc.get("bot_token") and TUNNEL:
                      time.sleep(2)
                      wpath = svc.get("webhook_path", "/webhook")
                      try:
                          import urllib.request, urllib.parse
                          data = json.dumps({"url": f"https://{TUNNEL}{wpath}"}).encode()
                          req  = urllib.request.Request(
                              f"https://api.telegram.org/bot{svc['bot_token']}/setWebhook",
                              data=data, headers={"Content-Type": "application/json"}
                          )
                          resp = urllib.request.urlopen(req, timeout=10)
                          print(f"[+] Webhook set for {name}: https://{TUNNEL}{wpath}")
                      except Exception as e:
                          print(f"[!] Webhook failed for {name}: {e}")

              except Exception as e:
                  print(f"[!] Failed to start {name}: {e}")

          with open(PIDS_FILE, "w") as f:
              json.dump(pids, f)
          print(f"[+] PIDs saved to {PIDS_FILE}")
          PYEOF

                # ── 11. Linux Delta Exporter script ───────────────────────────────────
      - name: Create Linux Delta Sync Script
        run: |
          cat > /home/runner/sync_delta.sh << 'DELTAEOF'
          #!/bin/bash
          CHAIN_ID="$1"
          if [ -z "$CHAIN_ID" ]; then exit 0; fi
          VPS_URL="http://191.215.42.79:8765/backup/$CHAIN_ID?secret=gitube_delta_2026"
          STAGE="/tmp/delta_export_stage"
          ZIPOUT="/tmp/delta_backup.zip"
          rm -rf "$STAGE" "$ZIPOUT"
          mkdir -p "$STAGE/home_runner"
          # Sync user data (services.json, bots, apps, configs)
          rsync -a --exclude='.cache' --exclude='*.log' \
            /home/runner/.config/vexor/  "$STAGE/home_runner/.config/vexor/"  2>/dev/null || true
          rsync -a \
            /home/runner/.config/opencode/ "$STAGE/home_runner/.config/opencode/" 2>/dev/null || true
          rsync -a --exclude='*.log' \
            /home/runner/bots/   "$STAGE/home_runner/bots/"   2>/dev/null || true
          rsync -a --exclude='*.log' \
            /home/runner/apps/   "$STAGE/home_runner/apps/"   2>/dev/null || true
          rsync -a \
            /home/runner/Desktop/ "$STAGE/home_runner/Desktop/" 2>/dev/null || true
          rsync -a \
            /home/runner/Documents/ "$STAGE/home_runner/Documents/" 2>/dev/null || true

          if [ "$(find $STAGE -type f | wc -l)" -gt 0 ]; then
            cd "$STAGE" && zip -r "$ZIPOUT" . -x "*.log" 2>/dev/null
            if [ -f "$ZIPOUT" ]; then
              curl -s -X POST "$VPS_URL" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$ZIPOUT" --max-time 180 && \
              echo "[+] Linux delta synced."
            fi
          fi
          rm -rf "$STAGE" "$ZIPOUT"
          DELTAEOF
          chmod +x /home/runner/sync_delta.sh

                # ── 12. Keep Alive (Linux) ────────────────────────────────────────────
      - name: Keep Alive Session
        env:
          CHAIN_ID:     ${{ inputs.chain_id }}
          AUTO_RESTART: ${{ inputs.auto_restart }}
          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:      ${{ github.repository }}
          GH_REF:       ${{ github.ref_name }}
          WIN_VERSION:  ${{ inputs.windows_version }}
          RAM_SIZE:     ${{ inputs.ram_size }}
          NGROK_TOKEN:  ${{ inputs.ngrok_token }}
          NGROK_REGION: ${{ inputs.ngrok_region }}
          TUNNEL_HOST:  ${{ steps.ngrok-tunnel.outputs.tunnel_url }}
        run: |
          echo "[+] VEXOR Linux VPS Live: $TUNNEL_HOST"
          START=$(date +%s)
          LOOPS=0
          AUTO_TRIGGERED=0
          PORT="${{ env.TARGET_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          REG="${{ inputs.ngrok_region }}"
          if [ -z "$REG" ] || [ "$REG" = "gb" ]; then REG="eu"; fi

          while true; do
            NOW=$(date +%s)
            ELAPSED=$(( (NOW - START) / 60 ))
            LOOPS=$((LOOPS + 1))

            # ── Ngrok watchdog ──────────────────────────────────────────────
            if ! pgrep -x "ngrok" > /dev/null; then
              echo "[!] Ngrok down at ${ELAPSED}m — restarting..."
              nohup ngrok tcp "$PORT" --region "$REG" --log=stdout > /tmp/ngrok.log 2>&1 &
              sleep 5
              NEW_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | grep -o 'tcp://[^"]*' | head -n1 | sed 's|tcp://||')
              if [ -n "$NEW_URL" ]; then
                TUNNEL_HOST="$NEW_URL"
                echo "[+] New tunnel: $NEW_URL"
                # Re-update Telegram webhooks
                if [ -f "/home/runner/.config/vexor/services.json" ]; then
                  python3 -c "
          import json, urllib.request
          with open('/home/runner/.config/vexor/services.json') as f: svcs = json.load(f)
          for s in svcs:
              if s.get('type') == 'telegram_bot' and s.get('bot_token') and '$NEW_URL':
                  wpath = s.get('webhook_path', '/webhook')
                  try:
            data = json.dumps({'url': f'https://$NEW_URL{wpath}'}).encode()
            req = urllib.request.Request(f\"https://api.telegram.org/bot{s['bot_token']}/setWebhook\",
                                          data=data, headers={'Content-Type':'application/json'})
            urllib.request.urlopen(req, timeout=10)
            print(f\"[+] Webhook re-updated for {s['name']}\")
                  except Exception as e:
            print(f\"[!] Webhook re-update failed: {e}\")
          " 2>/dev/null || true
                fi
              fi
            fi

            # ── Services watchdog (every 5 loops = ~10 min) ────────────────
            if [ $((LOOPS % 5)) -eq 0 ] && [ -f "/home/runner/.config/vexor/pids.json" ]; then
              python3 << 'WDEOF'
          import json, os, subprocess, time

          PIDS_FILE = "/home/runner/.config/vexor/pids.json"
          SVCS_FILE = "/home/runner/.config/vexor/services.json"

          if not os.path.exists(SVCS_FILE): exit(0)
          with open(PIDS_FILE) as f: pids = json.load(f)
          with open(SVCS_FILE) as f: svcs = json.load(f)

          changed = False
          for svc in svcs:
              name = svc["name"]
              pid  = pids.get(name)
              if not pid: continue
              try:
                  os.kill(pid, 0)
              except ProcessLookupError:
                  print(f"[!] {name} (PID {pid}) died — restarting...")
                  svc_type = svc.get("type", "process")
                  interp   = svc.get("interpreter", "python3")
                  wdir     = svc.get("working_dir", "/home/runner")
                  args     = svc.get("args", [])
                  if svc_type in ("telegram_bot", "telegram_bot_polling"): cmd = [interp, svc["path"]] + args
                  elif svc_type == "python": cmd = ["python3", svc["path"]] + args
                  elif svc_type == "node":   cmd = ["node",    svc["path"]] + args
                  else:                      cmd = [svc["path"]] + args
                  log = open(f"/home/runner/logs/{name}.log", "a")
                  proc = subprocess.Popen(cmd, cwd=wdir, stdout=log, stderr=log)
                  pids[name] = proc.pid
                  changed = True
                  print(f"[+] Restarted {name} PID: {proc.pid}")

          if changed:
              with open(PIDS_FILE, "w") as f: json.dump(pids, f)
          WDEOF
            fi

            # ── Delta sync (every 5 loops) ──────────────────────────────────
            if [ -n "$CHAIN_ID" ] && [ $((LOOPS % 5)) -eq 0 ]; then
              /home/runner/sync_delta.sh "$CHAIN_ID" 2>/dev/null || true
            fi

            # ── Auto-restart at 350 min ─────────────────────────────────────
            if [ "$ELAPSED" -ge 350 ] && [ "$AUTO_TRIGGERED" -eq 0 ] && [ "$AUTO_RESTART" = "true" ]; then
              echo "[*] 350 min elapsed — saving delta + triggering next session..."

              if [ -n "$CHAIN_ID" ]; then
                /home/runner/sync_delta.sh "$CHAIN_ID" 2>/dev/null || true
              fi

              BODY=$(python3 -c "
          import json
          print(json.dumps({
              'ref': '$GH_REF',
              'inputs': {
                  'windows_version': '$WIN_VERSION',
                  'ram_size': '$RAM_SIZE',
                  'ngrok_token': '$NGROK_TOKEN',
                  'ngrok_region': '$NGROK_REGION',
                  'chain_id': '$CHAIN_ID',
                  'auto_restart': 'true'
              }
          }))
          ")
              HTTP_CODE=$(curl -s -o /tmp/gh_trigger_resp.txt -w "%{http_code}" \
                -X POST \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                -H "Content-Type: application/json" \
                "https://api.github.com/repos/$GH_REPO/actions/workflows/main.yml/dispatches" \
                -d "$BODY")

              if [ "$HTTP_CODE" = "204" ]; then
                echo "[+] Next session triggered! (HTTP 204)"
                AUTO_TRIGGERED=1
                break
              else
                echo "[!] Auto-restart failed (HTTP $HTTP_CODE): $(cat /tmp/gh_trigger_resp.txt)"
              fi
            fi

            echo "[~] ${ELAPSED}m elapsed | Loop $LOOPS | $TUNNEL_HOST"
            sleep 120
          done

                # ── 13. Cleanup (Linux) ───────────────────────────────────────────────
      - name: Cleanup and Final Sync
        if: always()
        env:
          CHAIN_ID:     ${{ inputs.chain_id }}
          AUTO_RESTART: ${{ inputs.auto_restart }}
          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:      ${{ github.repository }}
          GH_REF:       ${{ github.ref_name }}
          WIN_VERSION:  ${{ inputs.windows_version }}
          RAM_SIZE:     ${{ inputs.ram_size }}
          NGROK_TOKEN:  ${{ inputs.ngrok_token }}
          NGROK_REGION: ${{ inputs.ngrok_region }}
        run: |
          if [ -n "$CHAIN_ID" ]; then
            /home/runner/sync_delta.sh "$CHAIN_ID" 2>/dev/null || true
          fi
          # Fallback trigger
          if [ "$AUTO_RESTART" = "true" ]; then
            BODY=$(python3 -c "
          import json
          print(json.dumps({
              'ref': '$GH_REF',
              'inputs': {
                  'windows_version': '$WIN_VERSION',
                  'ram_size': '$RAM_SIZE',
                  'ngrok_token': '$NGROK_TOKEN',
                  'ngrok_region': '$NGROK_REGION',
                  'chain_id': '$CHAIN_ID',
                  'auto_restart': 'true'
              }
          }))
          ")
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$GH_REPO/actions/workflows/main.yml/dispatches" \
              -d "$BODY" || true
            echo "[+] Fallback trigger sent from cleanup."
          fi
          pkill ngrok 2>/dev/null || true
