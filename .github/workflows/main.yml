                # ── 5. Wait for port ──────────────────────────────────────────────────
      - name: Wait for Service Port
        run: |
          port="${{ env.TARGET_PORT }}"
          if [ -z "$port" ]; then port=22; fi
          for i in $(seq 1 90); do
            if nc -z 127.0.0.1 $port 2>/dev/null || (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; then
              echo "[+] Port $port live in ${i}s"
              break
            fi
            if [ "$i" -eq 30 ] || [ "$i" -eq 60 ]; then
              echo "[*] Still waiting (${i}s)..."
              docker logs vps --tail 5 2>/dev/null || true
            fi
            sleep 1
          done

