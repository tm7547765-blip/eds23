            echo 'export LANG=en_US.UTF-8'      | sudo tee -a "$p/.bashrc" > /dev/null
            echo 'export LC_ALL=en_US.UTF-8'    | sudo tee -a "$p/.bashrc" > /dev/null
            echo 'export PYTHONIOENCODING=utf-8' | sudo tee -a "$p/.bashrc" > /dev/null
