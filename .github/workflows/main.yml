          sudo sed -i '/^\[Xorg\]/,/^\[/ s/^username=.*/username=runner/' /etc/xrdp/xrdp.ini
          sudo sed -i '/^\[Xorg\]/,/^\[/ s/^password=.*/password=VEXOR@2026/' /etc/xrdp/xrdp.ini
